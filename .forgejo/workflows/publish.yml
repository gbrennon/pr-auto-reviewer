name: Publish

on:
  push:
    tags:
      - "v*"
  pull_request:
    types: [closed]
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: codeberg-medium
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install dependencies
        run: uv sync --all-groups

      - name: Run tests
        run: uv run pytest tests/ --tb=short

  publish-testpypi:
    if: startsWith(gitea.ref, 'refs/tags/v')
    needs: test
    runs-on: codeberg-medium
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Build package
        run: uv build

      - name: Verify build artifacts
        run: |
          echo "=== Wheel contents ==="
          unzip -l dist/*.whl | grep -E '(template|fragment|\.md)' || true
          echo ""
          echo "=== Sdist contents ==="
          tar tzf dist/*.tar.gz | grep -E '(template|fragment|\.md)' || true

      - name: Publish to TestPyPI (verification gate)
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.TESTPYPI_TOKEN }}
        run: |
          uv tool install twine
          uvx twine upload \
            --repository testpypi \
            --non-interactive \
            dist/*

      - name: Verify TestPyPI install works
        run: |
          sleep 15  # let TestPyPI index the package
          python -m venv /tmp/testpypi-venv
          /tmp/testpypi-venv/bin/pip install \
            --index-url https://test.pypi.org/simple/ \
            --extra-index-url https://pypi.org/simple/ \
            pr-auto-reviewer==$(uv run python -c "import runpy; m=runpy.run_path('pyproject.toml'); print(m['project']['version'])")

  publish-codeberg:
    if: gitea.event.pull_request.merged == true && startsWith(gitea.event.pull_request.head.ref, 'release/v')
    needs: test
    runs-on: codeberg-medium
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Extract version from branch name
        id: version
        run: |
          BRANCH="${{ gitea.event.pull_request.head.ref }}"
          TAG="${BRANCH#release/}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Validate pyproject.toml version matches tag
        run: |
          EXPECTED="${{ steps.version.outputs.version }}"
          ACTUAL=$(uv run python -c "import runpy; m=runpy.run_path('pyproject.toml'); print(m['project']['version'])")
          if [ "$EXPECTED" != "$ACTUAL" ]; then
            echo "Version mismatch: tag=$EXPECTED, pyproject.toml=$ACTUAL"
            exit 1
          fi
          echo "Version $EXPECTED matches pyproject.toml"

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Create git tag
        run: |
          git config user.name "CI Bot"
          git config user.email "ci@codeberg.org"
          git tag -a "${{ steps.version.outputs.tag }}" -m "Release ${{ steps.version.outputs.tag }}"
          git push origin "${{ steps.version.outputs.tag }}"

      - name: Generate changelog and create Codeberg release
        env:
          FORGEJO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_STEP: ${{ steps.version.outputs.tag }}
          REPO_STEP: ${{ gitea.repository }}
          API_URL_STEP: ${{ gitea.server_url }}/api/v1
        run: |
          python3 << 'PYEOF'
          import json, os, subprocess

          tag = os.environ["TAG_STEP"]
          repo = os.environ["REPO_STEP"]
          api_url = os.environ["API_URL_STEP"]
          token = os.environ["FORGEJO_TOKEN"]

          prev = subprocess.run(
              ["git", "tag", "--sort=-creatordate"],
              capture_output=True, text=True
          ).stdout.strip().split("\n")
          prev_tag = next((t for t in prev if t != tag), None)
          is_dev = prev_tag is None
          rev_range = f"{prev_tag}..HEAD" if prev_tag else "HEAD"

          sections = {
              "feat": "Features", "fix": "Bug Fixes",
              "refactor": "Refactoring", "perf": "Performance",
              "docs": "Documentation", "test": "Tests",
              "ci": "CI/CD", "build": "Build System",
              "chore": "Chores", "style": "Style",
              "revert": "Reverts",
          }

          header = f"## {tag}"
          if is_dev:
              header += " (dev — unreleased)"
          body_parts = [header, ""]

          for prefix, label in sections.items():
              commits = subprocess.run(
                  ["git", "log", rev_range, "--pretty=format:- %s (%h)",
                   f"--grep=^{prefix}:", "-i"],
                  capture_output=True, text=True
              ).stdout.strip()
              if commits:
                  body_parts.append(f"### {label}")
                  body_parts.append(commits)
                  body_parts.append("")

          changelog = "\n".join(body_parts)
          print("=== Generated changelog ===")
          print(changelog)

          payload = {
              "tag_name": tag, "name": tag, "body": changelog,
              "draft": False, "prerelease": False,
              "target_commitish": "main",
          }

          result = subprocess.run(
              ["curl", "-s", "-X", "POST", f"{api_url}/repos/{repo}/releases",
               "-H", f"Authorization: token {token}",
               "-H", "Content-Type: application/json",
               "-d", json.dumps(payload)],
              capture_output=True, text=True
          )
          print(f"API response: {result.stdout}")
          if result.returncode != 0:
              print(f"API error: {result.stderr}")
              exit(1)
          PYEOF

      - name: Build package
        run: uv build

      - name: Publish to Codeberg PyPI registry
        env:
          TWINE_USERNAME: ${{ secrets.CODEBERG_PYPI_USERNAME }}
          TWINE_PASSWORD: ${{ secrets.CODEBERG_PYPI_TOKEN }}
        run: |
          uv tool install twine
          uvx twine upload \
            --repository-url https://codeberg.org/api/packages/${{ secrets.CODEBERG_PYPI_USERNAME }}/pypi/ \
            --non-interactive \
            dist/*
